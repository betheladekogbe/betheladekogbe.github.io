---
layout: default
---
<div class="subpage-header"><a class="breadcrumb" href="{{ '/journal/' | relative_url }}">← Journal</a><span class="eyebrow">Field notes / {{ page.date | date: '%B %Y' }}</span></div>
<article class="article-shell">
  <header class="article-header"><p class="eyebrow">{{ page.date | date: '%B %-d, %Y' }}</p><h1>{{ page.title }}</h1>{% if page.summary %}<p class="lede">{{ page.summary }}</p>{% endif %}</header>
  <div class="prose">{{ content }}</div>
  <div class="next-link"><a href="{{ '/journal/' | relative_url }}">More journal entries <span aria-hidden="true">↗</span></a></div>
</article>
