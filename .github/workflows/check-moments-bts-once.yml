name: Check Moments BTS photo similarity
on:
  push:
    paths:
      - '.github/workflows/check-moments-bts-once.yml'

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare Moments BTS images to existing gallery
        shell: bash
        run: |
          python -m pip install --quiet Pillow ImageHash
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import imagehash
          root=Path("assets/images/photography")
          files=sorted(p for p in root.iterdir() if p.suffix.lower() in {".jpg",".jpeg",".png",".webp",".avif"})
          new=[p for p in files if p.name.startswith("moments-bts-")]
          old=[p for p in files if p not in new]
          hashes={}
          for p in files:
              try:
                  with Image.open(p) as img:
                      hashes[p]=imagehash.phash(img)
              except Exception as exc:
                  print("UNREADABLE",p.name,exc)
          print("TOTAL",len(files),"NEW",len(new),"OLD",len(old))
          print("POTENTIAL MATCHES: distance <= 9")
          count=0
          for a in new:
              if a not in hashes: continue
              distances=sorted((hashes[a]-hashes[b],b.name) for b in old if b in hashes)
              if distances:
                  nearest=distances[0]
                  print("CLOSEST",a.name,nearest[0],nearest[1])
              for d,name in distances:
                  if d>9:break
                  print("POTENTIAL",a.name,name,d)
                  count+=1
          for i,a in enumerate(new):
              if a not in hashes:continue
              for b in new[:i]:
                  if b not in hashes:continue
                  d=hashes[a]-hashes[b]
                  if d<=9:
                      print("POTENTIAL_NEW_PAIR",a.name,b.name,d)
                      count+=1
          print("TOTAL POTENTIAL PAIRS",count)
          PY
