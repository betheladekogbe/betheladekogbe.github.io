name: Import the Holy Week cover into the portfolio
on:
  push:
    paths:
      - '.github/workflows/import-holy-week-cover.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-photo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Save the public project photograph
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/images/projects
          file="assets/images/projects/holy-week-cover.jpg"
          if [ ! -f "$file" ]; then
            curl -fLsS --retry 3 --connect-timeout 15 --max-time 90 \
              'https://static.wixstatic.com/media/aacd86_029e00401407411aa6202e2167ec8897~mv2.jpg' \
              -o "$file"
          fi
          test "$(wc -c < "$file")" -gt 5000
          file "$file"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$file"
          if ! git diff --staged --quiet; then
            git commit -m "Store Holy Week cover photograph locally"
            git push origin HEAD:main
          fi
