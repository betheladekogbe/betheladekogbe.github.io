name: Build downloadable resume PDF
on:
  push:
    paths:
      - '_data/latest_resume.json'
      - 'scripts/build_resume_pdf.py'
      - '.github/workflows/build-resume.yml'
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: publish-resume-pdf
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF dependencies
        run: python -m pip install --quiet reportlab pypdf
      - name: Build latest educational media PDF
        run: python scripts/build_resume_pdf.py
      - name: Validate PDF text and page count
        run: |
          python - <<'PY'
          from pypdf import PdfReader
          p="assets/resume/Bethel_Adekogbe_Educational_Media_Resume.pdf"
          r=PdfReader(p)
          content=" ".join(page.extract_text() or "" for page in r.pages)
          for term in ("BETHEL ADEKOGBE","Pentecostal Tabernacle","Red Thread","Roxbury Tenants","Proper Bantah"):
              assert term.lower() in content.lower(), term
          assert 1 <= len(r.pages) <= 4, len(r.pages)
          print("PDF verified, pages:",len(r.pages))
          PY
      - name: Publish PDF to repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/resume/Bethel_Adekogbe_Educational_Media_Resume.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Publish downloadable educational media resume PDF"
            git push origin HEAD:main
          fi
