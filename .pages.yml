# Pages CMS editing configuration for the existing Switch-style portfolio.
# This is the first content-editor integration step. The project directory and
# resume currently also have hardcoded data in JavaScript/HTML; those must be
# migrated before all edits can be made solely through Pages CMS.
media:
  - name: project_images
    label: Project images
    input: assets/images/projects
    output: /assets/images/projects
    categories: [image]
    rename: safe
  - name: photography
    label: Photography images
    input: assets/images/photography
    output: /assets/images/photography
    categories: [image]
    rename: safe
  - name: resume_files
    label: Resume PDFs
    input: assets/resume
    output: /assets/resume
    categories: [document]
    rename: safe
  - name: documents
    label: Resume and documents
    input: assets/documents
    output: /assets/documents
    categories: [document]
    rename: safe

content:
  - name: site_pages
    label: Home, About, Resume and Contact
    type: file
    path: _data/site_content.json
    format: json
    operations:
      delete: false
    fields:
      - name: brand
        label: Site identity and social links
        type: object
        fields:
          - name: name
            label: Display name
            type: string
          - name: subtitle
            label: Professional subtitle
            type: string
          - name: avatar
            label: Profile photograph
            type: image
            options:
              media: photography
          - name: footer
            label: Footer label
            type: string
          - name: linkedin
            label: LinkedIn URL
            type: string
          - name: instagram
            label: Instagram URL
            type: string
          - name: youtube
            label: YouTube URL
            type: string
      - name: home
        label: Home page
        type: object
        fields:
          - name: tiles
            label: Navigation tiles
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: page
                label: Navigation destination (keep existing value)
                type: string
                readonly: true
              - name: title
                label: Tile title
                type: string
              - name: description
                label: Subtitle
                type: text
              - name: image
                label: Cover image (blank keeps current artwork)
                type: image
                options:
                  media: photography
      - name: about
        label: About page
        type: object
        fields:
          - name: eyebrow
            label: Intro categories
            type: string
          - name: heading
            label: Headline
            type: string
          - name: intro
            label: Introduction paragraphs
            type: text
            list: true
          - name: portrait
            label: Headshot
            type: image
            options:
              media: photography
          - name: blocks
            label: Experience and background blocks
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: title
                type: string
              - name: text
                type: text
          - name: location
            label: Location text
            type: string
      - name: resume
        label: Resume page
        type: object
        fields:
          - name: eyebrow
            label: Resume subtitle
            type: string
          - name: heading
            label: Headline
            type: string
          - name: description
            label: Introduction
            type: text
          - name: tags
            label: Focus areas
            type: string
            list: true
          - name: pdf
            label: Downloadable PDF resume
            type: file
            options:
              media: resume_files
          - name: entries
            label: Work experience
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title} — {employer}"
            fields:
              - name: extra
                label: Place in additional experience
                type: boolean
              - name: date
                label: Employment dates
                type: string
              - name: title
                label: Role
                type: string
              - name: employer
                label: Employer
                type: string
              - name: highlights
                label: Accomplishment bullets
                type: text
                list: true
              - name: image
                label: Optional role photo (blank keeps existing)
                type: image
                options:
                  media: photography
          - name: education
            label: Education and skills cards
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: category
                type: string
              - name: title
                type: string
              - name: lines
                label: Details
                type: text
                list: true
      - name: contact
        label: Contact modal
        type: object
        fields:
          - name: heading
            label: Headline
            type: string
          - name: message
            label: Invitation
            type: text
          - name: email
            label: Contact email
            type: string

  - name: project_directory
    label: Projects tab (cards and detail pages)
    type: file
    path: _data/projects.json
    format: json
    list: true
    operations:
      delete: false
    fields:
      - name: id
        label: Unique project slug (lowercase and hyphens)
        type: string
        required: true
      - name: case
        label: Matching case-study slug
        type: string
      - name: caseurl
        label: Legacy project URL
        type: string
      - name: title
        label: Project title
        type: string
        required: true
      - name: short
        label: Short project title
        type: string
      - name: org
        label: Organization or client
        type: string
      - name: year
        label: Display year
        type: string
      - name: date
        label: Sorting date
        type: date
      - name: role
        label: My role
        type: string
      - name: categories
        label: Project filters
        type: select
        options:
          multiple: true
          values: [Direction, Video Editing, Educational Media, Audio, Photography, Graphic Design, Production, Color Grading]
      - name: img
        label: Fallback image key (legacy)
        type: string
      - name: cover
        label: Project card cover
        type: image
        options:
          media: project_images
      - name: summary
        label: Card and detail summary
        type: text
      - name: facts
        label: Project highlights
        type: string
        list: true
      - name: media
        label: Project photo gallery
        type: image
        list: true
        options:
          media: project_images
      - name: mediaContain
        label: Fit full image inside gallery frame
        type: boolean
      - name: mediaNote
        label: Photo gallery caption
        type: text
      - name: video
        label: Video URL
        type: string
      - name: audio
        label: Audio URL
        type: string
      - name: extraLinks
        label: Additional links
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{label}"
        fields:
          - name: label
            label: Link text
            type: string
          - name: url
            label: URL
            type: string
      - name: fullCaseHtml
        label: Full case study (formatted text, photos, video embeds)
        type: rich-text
        options:
          format: html
          media: project_images
          switcher: true
      - name: draft
        label: Hide unfinished project
        type: boolean

  - name: case_studies
    label: Project case studies
    type: collection
    path: _projects
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      fields: [title, date, role, featured]
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: layout
        label: Page layout
        type: string
        hidden: true
      - name: title
        label: Project title
        type: string
        required: true
      - name: organization
        label: Organization or client
        type: string
      - name: year
        label: Year
        type: string
      - name: date
        label: Project date
        type: date
      - name: category
        label: Category
        type: string
      - name: role
        label: My role
        type: string
      - name: summary
        label: Summary
        type: text
      - name: featured
        label: Featured
        type: boolean
      - name: order
        label: Display order
        type: number
      - name: art
        label: Artwork style
        type: string
      - name: image
        label: Cover artwork
        type: image
        options:
          media: project_images
      - name: image_alt
        label: Image description
        type: string
      - name: body
        label: Full case study
        type: rich-text
        options:
          media: project_images
          switcher: true

  - name: photo_gallery
    label: Photography gallery
    type: file
    path: _data/photography.json
    format: json
    list: true
    operations:
      delete: false
    fields:
      - name: src
        label: Photograph
        type: image
        required: true
        options:
          media: photography
      - name: alt
        label: Caption and accessibility description
        type: text
      - name: categories
        label: Photo filters
        type: select
        options:
          multiple: true
          values:
            - {name: portraits, label: Portraits}
            - {name: events, label: Events}
            - {name: concerts, label: Concerts}
            - {name: outdoors, label: Outdoors}
            - {name: behind-the-scenes, label: BTS}
            - {name: studio, label: Studio (existing legacy tag)}
      - name: edit_only
        label: Edit only (I did not take this photo)
        type: boolean
