# Pages CMS editing configuration for the existing Switch-style portfolio.
# This is the first content-editor integration step. The project directory and
# resume currently also have hardcoded data in JavaScript/HTML; those must be
# migrated before all edits can be made solely through Pages CMS.
media:
  - name: project_images
    label: Project images
    input: assets/images/projects
    output: /assets/images/projects
    categories: [image]
    rename: safe
  - name: photography
    label: Photography images
    input: assets/images/photography
    output: /assets/images/photography
    categories: [image]
    rename: safe
  - name: documents
    label: Resume and documents
    input: assets/documents
    output: /assets/documents
    categories: [document]
    rename: safe

content:
  - name: case_studies
    label: Project case studies
    type: collection
    path: _projects
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      fields: [title, date, role, featured]
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: layout
        label: Page layout
        type: string
        hidden: true
      - name: title
        label: Project title
        type: string
        required: true
      - name: organization
        label: Organization or client
        type: string
      - name: year
        label: Year
        type: string
      - name: date
        label: Project date
        type: date
      - name: category
        label: Category
        type: string
      - name: role
        label: My role
        type: string
      - name: summary
        label: Summary
        type: text
      - name: featured
        label: Featured
        type: boolean
      - name: order
        label: Display order
        type: number
      - name: art
        label: Artwork style
        type: string
      - name: image
        label: Cover artwork
        type: image
        options:
          media: project_images
      - name: image_alt
        label: Image description
        type: string
      - name: body
        label: Full case study
        type: rich-text
        options:
          media: project_images
          switcher: true

  - name: photo_gallery
    label: Photography gallery
    type: file
    path: _data/photography.json
    format: json
    list: true
    operations:
      delete: false
    fields:
      - name: src
        label: Photograph
        type: image
        required: true
        options:
          media: photography
      - name: alt
        label: Caption and accessibility description
        type: text
      - name: categories
        label: Photo filters
        type: select
        options:
          multiple: true
          values:
            - {name: portraits, label: Portraits}
            - {name: events, label: Events}
            - {name: concerts, label: Concerts}
            - {name: outdoors, label: Outdoors}
            - {name: behind-the-scenes, label: BTS}
            - {name: studio, label: Studio (existing legacy tag)}
      - name: edit_only
        label: Edit only (I did not take this photo)
        type: boolean
