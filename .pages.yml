# Pages CMS editing configuration for the existing Switch-style portfolio.
# This is the first content-editor integration step. The project directory and
# resume currently also have hardcoded data in JavaScript/HTML; those must be
# migrated before all edits can be made solely through Pages CMS.
media:
  - name: project_images
    label: Project images
    input: assets/images/projects
    output: /assets/images/projects
    categories: [image]
    rename: safe
  - name: project_videos
    label: Project videos (short MP4 and WebM files)
    input: assets/videos/projects
    output: /assets/videos/projects
    categories: [video]
    extensions: [mp4, webm]
    rename: safe
  - name: photography
    label: Photography images
    input: assets/images/photography
    output: /assets/images/photography
    categories: [image]
    rename: safe
  - name: resume_files
    label: Resume PDFs
    input: assets/resume
    output: /assets/resume
    categories: [document]
    rename: safe
  - name: documents
    label: Resume and documents
    input: assets/documents
    output: /assets/documents
    categories: [document]
    rename: safe

content:
  - name: site_pages
    label: Home, About, Resume and Contact
    type: file
    path: _data/site_content.json
    format: json
    operations:
      delete: false
    fields:
      - name: brand
        label: Site identity and social links
        type: object
        fields:
          - name: name
            label: Display name
            type: string
          - name: subtitle
            label: Professional subtitle
            type: string
          - name: avatar
            label: Profile photograph
            type: image
            options:
              media: photography
          - name: footer
            label: Footer label
            type: string
          - name: linkedin
            label: LinkedIn URL
            type: string
          - name: instagram
            label: Instagram URL
            type: string
          - name: youtube
            label: YouTube URL
            type: string
      - name: home
        label: Home page
        type: object
        fields:
          - name: tiles
            label: Navigation tiles
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: page
                label: Navigation destination (keep existing value)
                type: string
                readonly: true
              - name: title
                label: Tile title
                type: string
              - name: description
                label: Subtitle
                type: text
              - name: image
                label: Cover image (blank keeps current artwork)
                type: image
                options:
                  media: photography
      - name: about
        label: About page
        type: object
        fields:
          - name: eyebrow
            label: Intro categories
            type: string
          - name: heading
            label: Headline
            type: string
          - name: intro
            label: Introduction paragraphs
            type: text
            list: true
          - name: portrait
            label: Headshot
            type: image
            options:
              media: photography
          - name: blocks
            label: Experience and background blocks
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: title
                type: string
              - name: text
                type: text
          - name: location
            label: Location text
            type: string
          - name: pressLinks
            label: Press and article links
            description: External articles displayed at the bottom of your About Me page.
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: title
                label: Article title
                type: string
                required: true
              - name: publication
                label: Publication
                type: string
              - name: date
                label: Publication date (display text)
                type: string
              - name: description
                label: Short context
                type: text
              - name: url
                label: Article URL
                type: string
                required: true
      - name: resume
        label: Resume page
        type: object
        fields:
          - name: eyebrow
            label: Resume subtitle
            type: string
          - name: heading
            label: Headline
            type: string
          - name: description
            label: Introduction
            type: text
          - name: tags
            label: Focus areas
            type: string
            list: true
          - name: pdf
            label: Downloadable PDF resume
            type: file
            options:
              media: resume_files
          - name: entries
            label: Work experience
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title} — {employer}"
            fields:
              - name: extra
                label: Place in additional experience
                type: boolean
              - name: date
                label: Employment dates
                type: string
              - name: title
                label: Role
                type: string
              - name: employer
                label: Employer
                type: string
              - name: highlights
                label: Accomplishment bullets
                type: text
                list: true
              - name: image
                label: Optional role photo (blank keeps existing)
                type: image
                options:
                  media: photography
          - name: education
            label: Education and skills cards
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: category
                type: string
              - name: title
                type: string
              - name: lines
                label: Details
                type: text
                list: true
      - name: contact
        label: Contact modal
        type: object
        fields:
          - name: heading
            label: Headline
            type: string
          - name: message
            label: Invitation
            type: text
          - name: email
            label: Contact email
            type: string

  - name: project_directory
    label: Projects (all content)
    type: file
    path: _data/projects.json
    format: json
    list: true
    operations:
      delete: false
    fields:
      - name: id
        label: Unique project slug (lowercase and hyphens)
        type: string
        required: true
      - name: case
        label: Matching case-study slug
        type: string
      - name: caseurl
        label: Legacy project URL
        type: string
      - name: title
        label: Project title
        type: string
        required: true
      - name: short
        label: Short project title
        type: string
      - name: org
        label: Organization or client
        type: string
      - name: year
        label: Display year
        type: string
      - name: date
        label: Sorting date
        type: date
      - name: role
        label: My role
        type: string
      - name: categories
        label: Project filters
        type: select
        options:
          multiple: true
          values: [Direction, Video Editing, Educational Media, Audio, Photography, Graphic Design, Production, Color Grading]
      - name: img
        label: Fallback image key (legacy)
        type: string
      - name: cover
        label: Project card cover
        type: image
        options:
          media: project_images
      - name: summary
        label: Card and detail summary
        type: text
      - name: facts
        label: Project highlights
        type: string
        list: true
      - name: media
        label: Project photo gallery
        type: image
        list: true
        options:
          media: project_images
      - name: coverFit
        label: Project cover display
        description: Crop to fill, or show the complete image in the project card. The original photo is never changed.
        type: select
        options:
          values:
            - {name: cover, label: Fill frame (crop edges)}
            - {name: contain, label: Show entire image}
      - name: coverX
        label: Cover focus — left/right (0–100)
        description: 0 shows the left, 50 centers, 100 shows the right. Used when cropped to fill.
        type: number
        options: {min: 0, max: 100}
      - name: coverY
        label: Cover focus — top/bottom (0–100)
        description: 0 shows the top, 50 centers, 100 shows the bottom. Used when cropped to fill.
        type: number
        options: {min: 0, max: 100}
      - name: mediaContain
        label: Fit full image inside gallery frame (legacy default)
        type: boolean
      - name: mediaFrames
        label: Individual project gallery image framing
        description: Optional rules for each gallery image above. Use its position (1 = first photo, 2 = second). Framing adjusts display only, never the original.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "Gallery image #{fields.index}"
        fields:
          - name: index
            label: Gallery image number (1 = first)
            type: number
            required: true
            options: {min: 1}
          - name: fit
            label: Display
            type: select
            options:
              values:
                - {name: cover, label: Fill frame (crop edges)}
                - {name: contain, label: Show entire image}
          - name: x
            label: Image focus — left/right (0–100)
            type: number
            options: {min: 0, max: 100}
          - name: y
            label: Image focus — top/bottom (0–100)
            type: number
            options: {min: 0, max: 100}
      - name: projectVideos
        label: Playable videos — top gallery and full project
        description: Add a video from YouTube, Vimeo, Google Drive or an MP4/WebM file. The same video can appear in the top media reel and below the full project. Large full-length films are better hosted on YouTube or Vimeo.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Video title
            type: string
            required: true
          - name: url
            label: Video URL (YouTube, Vimeo, Google Drive or direct MP4/WebM)
            description: Leave blank if you upload a video file instead.
            type: string
          - name: file
            label: Upload video file (MP4 or WebM)
            description: Leave blank if using a video URL. Recommended only for small clips; GitHub file size limits apply.
            type: file
            options:
              media: project_videos
              extensions: [mp4, webm]
          - name: poster
            label: Video thumbnail image (optional)
            type: image
            options:
              media: project_images
          - name: caption
            label: Video caption (optional)
            type: text
          - name: showInGallery
            label: Play in top photo/video reel
            type: boolean
            default: true
          - name: showInCaseStudy
            label: Embed below full project
            type: boolean
            default: true
      - name: video
        label: Legacy video URL (also plays in top gallery)
        description: Older projects use this field. For new videos, use Playable videos above to control both locations.
        type: string
      - name: audio
        label: Audio URL
        type: string
      - name: extraLinks
        label: Additional links
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{label}"
        fields:
          - name: label
            label: Link text
            type: string
          - name: url
            label: URL
            type: string
      - name: fullCaseHtml
        label: Full project (formatted text, photos, video embeds)
        description: This is the sole editable project for this project. Use Source mode for complex custom HTML such as embeds and interactive layouts.
        type: rich-text
        options:
          format: html
          media: project_images
          switcher: true
      - name: draft
        label: Hide unfinished project
        type: boolean

  - name: photo_gallery
    label: Photography gallery
    type: file
    path: _data/photography.json
    format: json
    list: true
    operations:
      delete: false
    fields:
      - name: src
        label: Photograph
        type: image
        required: true
        options:
          media: photography
      - name: alt
        label: Caption and accessibility description
        type: text
      - name: categories
        label: Photo filters
        type: select
        options:
          multiple: true
          values:
            - {name: portraits, label: Portraits}
            - {name: events, label: Events}
            - {name: concerts, label: Concerts}
            - {name: outdoors, label: Outdoors}
            - {name: behind-the-scenes, label: BTS}
            - {name: studio, label: Studio (existing legacy tag)}
      - name: edit_only
        label: Edit only (I did not take this photo)
        type: boolean
